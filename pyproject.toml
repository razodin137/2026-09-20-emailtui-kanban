[project]
name = "mailkanban"
version = "0.1.0"
description = "A Gmail kanban TUI: labels as columns, move mail with simple commands"
requires-python = ">=3.11"
dependencies = [
    "textual==0.86.2",
]

[project.scripts]
mailkanban = "mailkanban.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailkanban"]
